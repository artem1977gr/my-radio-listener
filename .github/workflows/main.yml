name: Update Proxy List Every Day at 04:15 Moscow Time

on:
  # Запускаем по расписанию каждый день в 01:15 UTC (это 04:15 по Москве)
  schedule:
    - cron: '15 1 * * *'
  
  # Добавляем возможность запуска вручную
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Нужно для того, чтобы коммитить изменения обратно в репозиторий

      # Создаём виртуальное окружение и устанавливаем зависимости
      - name: Install dependencies ⚙️
        run: |
          python -m venv .venv
          source .venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt

      # Проверяем работу парсера и ловим все возможные ошибки
      - name: Run proxy scraper ✅
        run: |
          source .venv/bin/activate && python -u proxy_scraper.py || echo "Script failed with error code $?"
      
      # Проверяем, был ли создан файл с прокси
      - name: Check if file exists ❗️
        run: |
          ls -l working_proxies.txt
          # Если файл существует, следующий шаг будет выполнен
          # Если нет, это вызовет ошибку и остановит workflow

      # Отправка файла в репозиторий
      - name: Commit and push changes 📤
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update working proxies list" || echo "No changes to commit"
          git push origin main
