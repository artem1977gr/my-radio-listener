name: Update Proxy List Every 15 Minutes

on:
  # Запускаем по расписанию каждые 15 минут
  schedule:
    - cron: '*/15 * * * *'
  
  # Добавляем возможность запуска вручную
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Нужно для того, чтобы коммитить изменения обратно в репозиторий

      # Выводим ошибку в консоль, если скрипт упадёт
      - name: Run proxy scraper ✅
        run: |
          /usr/bin/python3 -u proxy_scraper.py || echo "Script failed with error code $?"
      
      # Проверяем, что файл был создан
      - name: Check if file exists ⚙️
        run: |
          ls -l working_proxies.txt
          # Если файл существует, следующий шаг будет выполнен
          # Если нет, это вызовет ошибку и остановит workflow

      # Создаём коммит и пушим файл в репозиторий
      - name: Commit and push changes 📤
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update working proxies list" || echo "No changes to commit"
          git push origin main
