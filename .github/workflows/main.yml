name: Update Residential Proxies List # <--- Исправил здесь

on:
  # Запускаем раз в сутки в 4:15 утра по Москве
  schedule:
    - cron: '15 1 * * *'
  
  # И даём возможность запускать вручную
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code ⚙️
        uses: actions/checkout@v3

      # Устанавливаем зависимости
      - name: Install dependencies ⚙️
        run: |
          python -m venv .venv
          source .venv/bin/activate && pip install --upgrade pip && pip install requests

      # Получаем API-ключи из секретов и передаём их скрипту как переменные окружения
      - name: Fetch and Save Residential Proxies ✅ # <--- Исправил здесь
        env:
          PROXIES_IO_API_KEY: ${{ secrets.PROXIES_IO_API_KEY }}
        run: |
          source .venv/bin/activate && python -u proxy_updater.py || echo "Script failed with error code $?"
        shell: bash {0: enable_stderr} # <--- Это покажет все [FAIL] ошибки!

      # Проверяем, появился ли файл working_proxies.txt
      - name: Check if file exists ❗️
        run: ls -l working_proxies.txt

      # Отправляем изменения обратно в репозиторий
      - name: Commit and push changes 📤
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update residental proxies list" || echo "No changes to commit"
          git push origin main
