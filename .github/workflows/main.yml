name: Update Residential Proxies List ✅

on:
  # Оставляем только ручное управление через интерфейс GitHub Actions
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code ⚙️
        uses: actions/checkout@v3

      - name: Install dependencies ⚙️
        run: |
          python -m venv .venv
          source .venv/bin/activate && pip install --upgrade pip requests

      # Этот шаг теперь просто выводит логи работы скрипта,
      # но не меняет содержимое working_proxies.txt
      - name: Fetch and Save Residential Proxies ✅
        env:
          PROXIES_IO_API_KEY: ${{ secrets.PROXIES_IO_API_KEY }}
        run: |
          source .venv/bin/activate && \
            python -u proxy_updater.py |& cat || echo "Script failed with error code $?"
