name: Update Residential Proxies List

on:
  # Запускаем раз в сутки в 4:15 утра по Москве
  schedule:
    - cron: '15 1 * * *'
  
  # И даём возможность запускать вручную
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    
    steps:
      # Загружаем исходники из репозитория
      - name: Checkout code ⚙️
        uses: actions/checkout@v3

      # Создаём и активируем виртуальное окружение
      - name: Install dependencies ⚙️
        run: |
          python -m venv .venv
          source .venv/bin/activate && pip install --upgrade pip requests

      # Получаем API-ключи из секретов и передаём их скрипту как переменные окружения
      # |& cat объединяет stdout и stderr и выводит всё в консоль
      - name: Fetch and Save Residential Proxies ✅
        env:
          PROXIES_IO_API_KEY: ${{ secrets.PROXIES_IO_API_KEY }}
        run: |
          source .venv/bin/activate && \
            python -u proxy_updater.py --count=200 |& cat || echo "Script failed with error code $?"
      
      # Проверка наличия файла working_proxies.txt
      - name: Check if file exists ❗️
        run: ls -l working_proxies.txt

      # Отправляем изменения обратно в репозиторий
      - name: Commit and push changes 📤
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update residental proxies list" || echo "No changes to commit"
          git push origin main
